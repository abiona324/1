            height: 100vh;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px 50px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 10000;
            text-align: center;
        }
        .loading h2 {
            color: #0F172A;
            margin-bottom: 15px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #003B73;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 10000;
            text-align: center;
            max-width: 500px;
        }
        .error h2 {
            color: #C1121F;
            margin-bottom: 15px;
        }
        .error p {
            color: #1F2937;
            margin-bottom: 15px;
        }
        .error a {
            color: #007bff;
            text-decoration: none;
        }
        .error a:hover {
            text-decoration: underline;
        }
    </style>

                            weight: 0,
                            opacity: 1,
                            color: 'none',
                            dashArray: '3',
                            fillOpacity: opacity
                        };

                        });
